
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facebook Video Downloader</title>
<style>
body{margin:0;padding:20px;font-family:Arial;background:#edf4ff;color:#172554}
main{max-width:440px;margin:45px auto;background:white;padding:24px;border-radius:20px;text-align:center;box-shadow:0 5px 25px #0001}
.logo{margin:auto;background:#1877f2;color:white;border-radius:16px;width:60px;height:60px;display:grid;place-items:center;font-size:40px;font-weight:bold}
h1{color:#1877f2;font-size:25px}
p{line-height:1.5;color:#64748b}
input,button{width:100%;box-sizing:border-box;padding:14px;margin-top:12px;border-radius:10px;font-size:15px}
input{border:1px solid #cbd5e1}
button{background:#1877f2;color:white;border:0;font-weight:bold}
#message{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<div class="logo">f</div>
<h1>Facebook Video Downloader</h1>
<p>Enter a direct video URL you own or are authorized to download.</p>
<input id="url" type="url" placeholder="https://example.com/video.mp4">
<button id="download">Download Video</button>
<p id="message">Ready.</p>
</main>
<script>
document.getElementById("download").onclick=async function(){
 const field=document.getElementById("url");
 const msg=document.getElementById("message");
 let u;
 try{
  u=new URL(field.value.trim());
  if(u.protocol!=="https:")throw Error();
 }catch(e){
  msg.textContent="Please enter a valid HTTPS video URL.";
  return;
 }
 msg.textContent="Checking video...";
 try{
  const r=await fetch(u.href);
  if(!r.ok)throw Error();
  const type=r.headers.get("content-type")||"";
  if(!type.includes("video/"))throw Error();
  const blob=await r.blob();
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="video.mp4";
  a.click();
  msg.textContent="Download started. Check your Downloads folder.";
 }catch(e){
  msg.textContent="This video host blocks browser access or the URL is not a direct video file. Try an authorized MP4 link from a source that allows browser downloads.";
 }
};
</script>
</body>
</html>
